services:
  - type: web
    name: kspdb-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kspdb-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000

databases:
  - name: kspdb-db
    databaseName: kspdb
    user: kspdb
